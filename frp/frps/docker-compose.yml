services:
  frps:
    image: snowdreamtech/frps:latest
    container_name: frps
    restart: unless-stopped
    ports:
      # frpc 客户端连接端口（对应 frps.toml 中的 bindPort）
      - "27391:27391"
      # 映射出去的 SFTP 公网端口（对应 frpc.toml 中的 remotePort）
      - "26584:26584"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
