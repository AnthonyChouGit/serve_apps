# frpc 客户端配置（部署在内网 SFTP 服务器上）
serverAddr = "x.x.x.x"  # 替换为 VPS 的公网 IP 或域名
serverPort = 19473

# 使用 QUIC 协议连接 frps（基于 UDP，抗网络抖动与丢包；需 VPS 安全组放行 UDP 19473）
transport.protocol = "quic"

auth.method = "token"
auth.token = "your_frp_token"

# 将 SFTP 容器映射在宿主机的 18422 端口转发至 VPS 的 18635 端口
[[proxies]]
name = "sftp"
type = "tcp"
localIP = "host.docker.internal"
localPort = 18422
remotePort = 18635
