server {
  listen 80;
  server_name example.com www.example.com synctv.example.com;

  location / {
    return 301 https://$host$request_uri;
  }

  location /.well-known/acme-challenge {
    root /acme;
  }
}

upstream poseidon_backend {
  server poseidon_backend:3000;
}

server {
  listen 443 ssl;
  server_name example.com www.example.com;
  ssl_certificate /etc/letsencrypt/live/my_site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/my_site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Protocol $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header REMOTE-HOST $remote_addr;

  location /subscribe/your_secret_path {
    alias /public/subscribe/config.yml;
  }
  
  location / {
    root /public/poseidon/dist;
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://poseidon_backend;
    proxy_set_header Host $host;
  }

  location /media {
    alias /public/poseidon/media;
  }

}

server {
  listen 443 ssl;
  server_name synctv.example.com;
  ssl_certificate /etc/letsencrypt/live/my_site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/my_site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Protocol $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header REMOTE-HOST $remote_addr;
  
  location = /api/room/ws {
    proxy_pass http://synctv:8080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    client_max_body_size 20m;
    proxy_cache off;
    proxy_buffering off;
    proxy_http_version 1.1;
  }

  location / {
    proxy_pass http://synctv:8080;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    client_max_body_size 20m;
    proxy_cache off;
    proxy_buffering off;
    proxy_http_version 1.1;
  }

}
