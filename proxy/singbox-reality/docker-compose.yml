services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box
    restart: always
    network_mode: host
    volumes:
      - ./data:/etc/sing-box
    command: -C /etc/sing-box/ run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"